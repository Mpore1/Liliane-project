<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lily's Shop | Children's Underwear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-category="children">
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-badge">L</div>
        <div>
          <p class="brand-name">Lily's Shop</p>
          <span class="brand-subtitle">Kids' comfort edition</span>
        </div>
      </div>
      <nav class="main-nav" aria-label="Main menu">
        <a href="./Lily SHOP.html">Home</a>
        <a href="./men.html">Men</a>
        <a href="./women.html">Women</a>
        <a href="./children.html">Children</a>
      </nav>
      <div class="topbar-actions">
        <button type="button" class="cart-button">Cart <span class="cart-count">0</span></button>
        <a href="./Lily SHOP.html" class="back-link">← Back</a>
      </div>
    </header>

    <main>
      <a class="back-link" href="./Lily SHOP.html">← Return to home</a>
      <section class="catalog-layout">
        <aside class="sidebar-panel">
          <p class="section-tag">Children</p>
          <h2>Shop the range</h2>
          <div class="catalog-toolbar">
  <input type="text" id="search-input" class="search-input" placeholder="Search products..." />
  <select id="sort-select" class="sort-select">
    <option value="default">Sort by: Featured</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>
</div>
        </aside>

        <section class="shop-grid" id="products"></section>
      </section>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
